name: Vendor local Portal typefaces (one-time)
on:
  push:
    branches:
      - feature/portal-type-system-optical-marks-20261114
    paths:
      - '.github/workflows/portal-fonts-vendor-once.yml'
permissions:
  contents: write
jobs:
  vendor:
    if: github.repository == 'MedioCritasVT/CrystalCove'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Download pinned OFL font subsets and verify Git object IDs
        shell: bash
        run: |
          set -euo pipefail
          FONT_ROOT="conflux/portal-app/fonts"
          UPSTREAM="https://raw.githubusercontent.com/ForeverHYX/Homepage/31e922c011d20b60ca0f0119c28116dbf1251c58"
          mkdir -p "$FONT_ROOT/licenses"
          fetch_verified() {
            local source="$1" target="$2" expected="$3" actual
            curl --fail --show-error --silent --location --max-time 40 \
              --proto '=https' --tlsv1.2 \
              "$UPSTREAM/$source" -o "$target"
            actual="$(git hash-object "$target")"
            test "$actual" = "$expected" || {
              echo "Pinned upstream Git object mismatch for $source" >&2
              exit 1
            }
          }
          fetch_verified "static/fonts/marcellus-latin-v14.woff2" "$FONT_ROOT/Marcellus-Latin.woff2" "30ea7f440a97b7cf74d92bed5c9fa34511c18e8c"
          fetch_verified "static/fonts/source-sans-3-latin-v19.woff2" "$FONT_ROOT/SourceSans3-Latin.woff2" "024a59dfe39fa9720e62b923546b54d5098699d2"
          fetch_verified "static/fonts/jetbrains-mono-latin-v24.woff2" "$FONT_ROOT/JetBrainsMono-Latin.woff2" "2ca6ac605954ee884442db8ea1d61093000bcc29"
          fetch_verified "static/fonts/licenses/marcellus-OFL.txt" "$FONT_ROOT/licenses/Marcellus-OFL.txt" "f40ef7463338e0fb70407fa0d4ee63cd3ac30d63"
          fetch_verified "static/fonts/licenses/source-sans-3-OFL.txt" "$FONT_ROOT/licenses/SourceSans3-OFL.txt" "a04c13f4392028cbaf5e8da754f3e2eeff3c6697"
          fetch_verified "static/fonts/licenses/jetbrains-mono-OFL.txt" "$FONT_ROOT/licenses/JetBrainsMono-OFL.txt" "821a3dac22aff15a1f1c9689a1d79c45bb58ca39"
          for file in "$FONT_ROOT"/*.woff2; do
            test "$(head -c 4 "$file")" = "wOF2" || exit 1
          done
          echo "All three local fonts and OFL licenses verified and staged."
      - name: Commit pinned font binaries and licenses to review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Conflux Font Vendor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conflux/portal-app/fonts
          if git diff --cached --quiet; then
            echo "Pinned fonts already present."
          else
            git commit -m "Bundle pinned OFL Marcellus Source Sans 3 and JetBrains Mono subsets"
            git push origin HEAD:feature/portal-type-system-optical-marks-20261114
          fi
