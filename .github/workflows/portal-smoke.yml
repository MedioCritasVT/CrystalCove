name: Conflux Portal smoke checks

on:
  pull_request:
    paths:
      - 'conflux/portal-app/**'
      - 'conflux/soundtrack/**'
      - 'docs/**'
      - '.github/workflows/portal-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'conflux/portal-app/**'
      - 'conflux/soundtrack/**'
      - 'docs/**'

permissions:
  contents: read

jobs:
  portal-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python server and local discovery tests
        working-directory: conflux/portal-app
        run: python3 -m unittest discover -p "test_*.py" -v
      - name: Compile local Python entry points
        working-directory: conflux/portal-app
        run: python3 -m compileall -q portal.py app_updater.py portal_desktop.py install_desktop_launcher.py game_locator.py
      - name: JavaScript parse check
        run: |
          node --check conflux/portal-app/app.js
          node --check conflux/portal-app/music.js
          node --check conflux/portal-app/readme.js
          node --check conflux/portal-app/link_choice.js
          node --check docs/soundtrack.js
      - name: Local music player parse and no-autoplay smoke check
        working-directory: conflux/portal-app
        run: |
          node --check music.js
          node test_music.js
      - name: Browser-flow DOM smoke check (no browser packages)
        working-directory: conflux/portal-app
        run: node test_ui.js
      - name: External link tab/window/cancel choice smoke
        working-directory: conflux/portal-app
        run: node test_link_choice.js
      - name: Browser journey in real Chromium with the published Conflux soundtrack
        if: github.event_name == 'pull_request'
        working-directory: conflux/portal-app
        run: |
          python3 -m pip install --user playwright
          python3 tools/browser_journey.py
      - name: Preserve browser screenshots and review notes
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: conflux-portal-browser-journey
          path: conflux/portal-app/browser-proof/
          if-no-files-found: ignore
