name: Conflux Portal smoke checks

on:
  pull_request:
    paths:
      - 'conflux/portal-app/**'
      - '.github/workflows/portal-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'conflux/portal-app/**'

permissions:
  contents: read

jobs:
  portal-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python server and local discovery tests
        working-directory: conflux/portal-app
        run: python3 -m unittest discover -p "test_*.py" -v
      - name: Compile local Python entry points
        working-directory: conflux/portal-app
        run: python3 -m compileall -q portal.py app_updater.py portal_desktop.py install_desktop_launcher.py game_locator.py
      - name: JavaScript parse check
        run: node --check conflux/portal-app/app.js
      - name: Browser-flow DOM smoke check (no browser packages)
        working-directory: conflux/portal-app
        run: node test_ui.js
